[project]
name = "vahan-rpa-api"
version = "0.1.0"
description = "MVP control plane for the VAHAN RPA web UI and browser extension"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "python-socketio[asyncio-client]>=5.12,<6",
  "pydantic>=2.10,<3",
  "uvicorn[standard]>=0.34,<1",
  "python-multipart>=0.0.18,<1",
  "aiofiles>=24,<25",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8,<10",
  "pytest-asyncio>=0.25,<2",
]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
