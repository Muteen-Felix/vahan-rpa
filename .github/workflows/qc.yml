# qc-agent:generated — gate tự động của repo này. Ghim @<commit SHA> (không @main) và image theo digest.
# Xem docs/usage-ci.md trong repo qc-agent. Bật chặn merge: branch protection yêu cầu job `qc-agent / vahan-rpa` xanh.
name: qc
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  qc:
    permissions:               # quyền TỐI THIỂU; workflow tái sử dụng không xin thêm
      contents: read
      checks: write            # Check Run "qc-agent / vahan-rpa"
      pull-requests: write     # comment dính trên PR
      packages: read           # kéo image từ GHCR
    uses: Muteen-Felix/QC-Agent/.github/workflows/qc-gate.reusable.yml@62dda38b628ff4d54d925fa4012656825a1b25f4
    with:
      project: vahan-rpa
      image: ghcr.io/muteen-felix/qc-agent@sha256:25e6f3cd93e22e706f1325bc525cf449ea79308b3d99c4b88fd6717a63384ac0
      sut_health_path: "/api/health"
      sut_ui_dockerfile: ".qc-agent/Dockerfile.ui"
      sut_ui_context: "apps/web-ui"
      sut_ui_port: "8080"
      sut_env: |
        VAHAN_API_CORS_ORIGINS=http://ui:8080
      sut_ui_build_args: |
        VITE_API_URL=http://sut:8000
    secrets: inherit
