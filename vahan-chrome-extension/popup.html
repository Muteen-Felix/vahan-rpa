<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vinfast RPA Assistant</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup-shell">
      <header class="popup-header">
        <nav class="popup-nav" role="tablist" aria-label="Extension navigation">
          <button id="statusTab" class="active" type="button" role="tab" aria-selected="true">Status</button>
          <button id="settingsTab" type="button" role="tab" aria-selected="false">Settings</button>
        </nav>
      </header>

      <div id="statusView" class="popup-view">
        <section class="status-card" aria-label="Backend connection status">
          <div id="runnerConnection" class="runner-connection" data-state="connecting">
            <span class="connection-dot" aria-hidden="true"></span>
            <strong class="connection-text">Connecting to backend...</strong>
          </div>
          <p id="connectionDetail" class="connection-detail">Loading extension settings.</p>
        </section>

        <section class="status-card workflow-card" aria-labelledby="workflowHeading">
          <div class="card-heading">
            <h1 id="workflowHeading">Activity</h1>
            <span id="workflowBadge" class="workflow-badge" data-state="idle">Ready</span>
          </div>
          <strong id="workflowTitle" class="workflow-title">No active job</strong>
          <div id="workflowMeta" class="workflow-meta" hidden></div>
          <p id="workflowDetail" class="workflow-detail">Create a report in the Web UI to get started.</p>
          <p id="workflowJobId" class="workflow-job-id" hidden></p>
        </section>

        <section id="authGuard" class="auth-guard" hidden aria-live="assertive">
          <strong>VAHAN authentication required</strong>
          <p id="authGuardMessage"></p>
          <div class="auth-guard-actions">
            <button id="reloadVahanTab" class="primary-button" type="button">Reload VAHAN</button>
            <button id="clearAuthHold" class="secondary-button" type="button">Clear pause</button>
          </div>
        </section>
      </div>

      <section id="backendSettings" class="backend-settings popup-view" hidden aria-labelledby="settingsHeading">
        <h1 id="settingsHeading">Cài đặt extension</h1>
        <div class="settings-body">
          <label>Server URL<input id="runnerServerUrl" type="url" value="http://127.0.0.1:8000" /></label>
          <label>Tên runner<input id="runnerName" value="VAHAN Chrome" /></label>
          <label>Runner token<input id="runnerToken" type="password" value="change-me" autocomplete="off" /></label>
          <button id="saveRunnerConfig" class="primary-button" type="button">Lưu và kết nối lại</button>
          <p id="status" class="form-status" role="status"></p>
        </div>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
